# Shared defaults and domain overrides for rcstack.
schema_version: "2.0"
profile: "rcstack-main"
models:
  astra:
    driver_kind: "codex"
    model: "GPT 6.2 Astra"
  sol:
    driver_kind: "codex"
    model: "GPT 6.2 Sol"
  fable:
    driver_kind: "claudeAgent"
    model: "Claude Fable 5.2"
  opus:
    driver_kind: "claudeAgent"
    model: "Claude Opus 5.5"
  sonnet:
    driver_kind: "claudeAgent"
    model: "Claude Sonnet 5.5"
  neon:
    driver_kind: "antigravity"
    model: "Gemini 4 Neon"
  carbon:
    driver_kind: "antigravity"
    model: "Gemini 4 Carbon"
  hydrogen:
    driver_kind: "antigravity"
    model: "Gemini 4 Hydrogen"
  notebook:
    driver_kind: "external"
    model: "Gemini Notebook"
  grok:
    driver_kind: "cursor"
    model: "Cursor Grok 4.7"
invariants:
  require_reviewer_not_equal_builder: true
  require_fresh_context_audit: true
  allow_self_review_on_fallback: false
tier3_path_patterns:
  - "auth/**"
  - "sandbox/**"
  - "infra/**"
  - "**/Dockerfile*"
  - "adapters/install.sh"
  - "scripts/verify.mjs"
  - "scripts/rc-receipt.mjs"
  - "scripts/rc-state.mjs"
  - "profiles/schema.json"
capabilities:
  systems_research:
    primary: "astra"
    fallback: "neon"
  architect_blueprint:
    primary: "fable"
    fallback: "astra"
  primary_builder:
    primary: "neon"
    fallback: "sol"
  security_builder:
    primary: "opus"
    fallback: "astra"
  vibe_executor:
    primary: "sol"
    secondary: "neon"
    fallback: "sonnet"
  deep_grounding:
    primary: "neon"
    fallback: "astra"
    paired: "astra"
    companion: "notebook"
  quick_lookup:
    primary: "hydrogen"
    exclusive: true
domains:
  engineering:
    profile_id: "rcstack-engineering"
    description: "Routing for building, fixing, refactoring, shipping, and maintaining software."
    capabilities:
      primary_builder:
        primary: "opus"
        secondary: "neon"
        fallback: "sol"
      security_builder:
        primary: "neon"
        secondary: "opus"
        fallback: "astra"
      vibe_executor:
        primary: "fable"
        secondary: "neon"
        fallback: "sol"
      deep_grounding:
        primary: "carbon"
        fallback: "astra"
        paired: "astra"
    default_capabilities:
      "0":
        - "quick_lookup"
      "1":
        - "vibe_executor"
      "2":
        - "systems_research"
        - "architect_blueprint"
        - "primary_builder"
        - "independent_reviewer"
      "3":
        - "systems_research"
        - "architect_blueprint"
        - "security_builder"
        - "independent_reviewer"
  study:
    profile_id: "rcstack-study"
    description: "Routing for learning a topic deeply, drilling recall, and stress-testing mental models."
    capabilities:
      systems_research:
        primary: "astra"
        fallback: "fable"
      primary_builder:
        primary: "neon"
        fallback: "sonnet"
    default_capabilities:
      "0":
        - "quick_lookup"
      "1":
        - "vibe_executor"
        - "primary_builder"
      "2":
        - "deep_grounding"
        - "architect_blueprint"
        - "systems_research"
        - "independent_reviewer"
      "3":
        - "deep_grounding"
        - "architect_blueprint"
        - "systems_research"
        - "security_builder"
        - "independent_reviewer"
  research:
    profile_id: "rcstack-research"
    description: "Routing for viability spikes and cited, adversarially reviewed research reports."
    capabilities:
      systems_research:
        primary: "astra"
        fallback: "opus"
    default_capabilities:
      "0":
        - "quick_lookup"
      "1":
        - "vibe_executor"
      "2":
        - "deep_grounding"
        - "systems_research"
        - "architect_blueprint"
        - "primary_builder"
        - "independent_reviewer"
      "3":
        - "deep_grounding"
        - "systems_research"
        - "architect_blueprint"
        - "security_builder"
        - "independent_reviewer"
review_matrix:
  default_fallback: "grok"
  neon:
    primary: "opus"
  opus:
    primary: "neon"
  sol:
    primary: "opus"
    tier1_primary: "neon"
  sonnet:
    primary: "neon"
  astra:
    primary: "opus"
  fable:
    primary: "neon"
risk_tiers:
  "0":
    name: "lookup"
    required_assurance: "A0"
    require_spec: false
    require_state_file: false
    require_verify: false
    require_receipt_gate: false
    require_cross_model_audit: false
    require_review_map: false
    log_telemetry: false
  "1":
    name: "iterate"
    required_assurance: "A1"
    require_spec: false
    require_state_file: false
    require_verify: true
    require_receipt_gate: false
    require_cross_model_audit: false
    require_review_map: false
    log_telemetry: false
  "2":
    name: "standard"
    required_assurance: "A2"
    require_spec: true
    require_state_file: true
    require_verify: true
    require_receipt_gate: true
    require_cross_model_audit: true
    require_review_map: true
    log_telemetry: true
  "3":
    name: "critical"
    required_assurance: "A3"
    require_spec: true
    require_state_file: true
    require_verify: true
    require_receipt_gate: true
    require_cross_model_audit: true
    require_review_map: true
    log_telemetry: true
