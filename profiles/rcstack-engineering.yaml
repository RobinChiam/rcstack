# rcstack-engineering — default routing template (seeded into ~/.rcstack/profiles/ on first install).
#
# Binds abstract capabilities to concrete models, names the reviewer for every builder, and sets
# the gates of risk tiers 0-3. Edit the machine-local copy in ~/.rcstack/profiles/, not dist.
#
# Strict YAML subset (system spec section 3.1): 2-space indentation, block mappings and sequences,
# double-quoted model names and globs. No tabs, anchors, tags, flow collections or block scalars.
# Validate with: node scripts/verify.mjs --profile <this file>

schema_version: "1.0"
profile: "rcstack-engineering"
domain: "engineering"
description: "Routing for building, fixing, refactoring, shipping, and maintaining software."

# Pinned by profiles/schema.json. No profile can opt out of independent review.
invariants:
  require_reviewer_not_equal_builder: true
  require_fresh_context_audit: true
  allow_self_review_on_fallback: false

# Any target or touched path matching one of these globs escalates the run to Tier 3.
tier3_path_patterns:
  - "auth/**"
  - "sandbox/**"
  - "infra/**"
  - "**/Dockerfile*"
  - "adapters/install.sh"
  - "scripts/verify.mjs"
  - "scripts/rc-receipt.mjs"
  - "scripts/rc-state.mjs"
  - "profiles/schema.json"

# driver_kind + model are portable descriptors. rc-router maps them to a live provider and
# catalog id at dispatch time; never store a machine-specific provider instance id here.
capabilities:
  systems_research:
    driver_kind: "codex"
    model: "GPT 6.2 Astra"
    fallback:
      driver_kind: "antigravity"
      model: "Gemini 4 Neon"
  architect_blueprint:
    driver_kind: "claudeAgent"
    model: "Claude Fable 5.2"
    fallback:
      driver_kind: "codex"
      model: "GPT 6.2 Astra"
  primary_builder:
    driver_kind: "claudeAgent"
    model: "Claude Opus 5.5"
    secondary:
      driver_kind: "antigravity"
      model: "Gemini 4 Neon"
    fallback:
      driver_kind: "codex"
      model: "GPT 6.2 Sol"
  security_builder:
    driver_kind: "antigravity"
    model: "Gemini 4 Neon"
    secondary:
      driver_kind: "claudeAgent"
      model: "Claude Opus 5.5"
    fallback:
      driver_kind: "codex"
      model: "GPT 6.2 Astra"
  vibe_executor:
    driver_kind: "claudeAgent"
    model: "Claude Fable 5.2"
    secondary:
      driver_kind: "antigravity"
      model: "Gemini 4 Neon"
    fallback:
      driver_kind: "codex"
      model: "GPT 6.2 Sol"
  deep_grounding:
    driver_kind: "antigravity"
    model: "Gemini 4 Carbon"
    paired:
      driver_kind: "codex"
      model: "GPT 6.2 Astra"
    fallback:
      driver_kind: "codex"
      model: "GPT 6.2 Astra"
  # exclusive: this model serves Tier 0 lookups only; it is bound nowhere else and never reviews.
  quick_lookup:
    driver_kind: "antigravity"
    model: "Gemini 4 Hydrogen"
    exclusive: true

# builder model -> reviewers. scripts/verify.mjs enforces reviewer != builder for every entry.
# One audit has exactly one reviewer: the fallback is used only when the primary is unreachable.
# Reviewers only review: the fallback reviewer is never promoted into a builder capability.
review_matrix:
  "Gemini 4 Neon":
    primary: "Claude Opus 5.5"
    fallback: "Cursor Grok 4.7"
  "Claude Opus 5.5":
    primary: "Gemini 4 Neon"
    fallback: "Cursor Grok 4.7"
  "GPT 6.2 Sol":
    primary: "Claude Opus 5.5"
    tier1_primary: "Gemini 4 Neon"
    fallback: "Cursor Grok 4.7"
  "Claude Sonnet 5.5":
    primary: "Gemini 4 Neon"
    fallback: "Cursor Grok 4.7"
  "GPT 6.2 Astra":
    primary: "Claude Opus 5.5"
    fallback: "Cursor Grok 4.7"
  "Claude Fable 5.2":
    primary: "Gemini 4 Neon"
    fallback: "Cursor Grok 4.7"
  default_fallback: "Cursor Grok 4.7"

# Tier N has the assurance floor A<N> (system spec section 3.4).
risk_tiers:
  "0":
    name: "lookup"
    required_assurance: "A0"
    default_capabilities:
      - quick_lookup
    require_spec: false
    require_state_file: false
    require_verify: false
    require_receipt_gate: false
    require_cross_model_audit: false
    require_review_map: false
    log_telemetry: false
  "1":
    name: "iterate"
    required_assurance: "A1"
    default_capabilities:
      - vibe_executor
    require_spec: false
    require_state_file: false
    require_verify: true
    require_receipt_gate: false
    require_cross_model_audit: false
    require_review_map: false
    log_telemetry: false
  "2":
    name: "standard"
    required_assurance: "A2"
    default_capabilities:
      - systems_research
      - architect_blueprint
      - primary_builder
      - independent_reviewer
    require_spec: true
    require_state_file: true
    require_verify: true
    require_receipt_gate: true
    require_cross_model_audit: true
    require_review_map: true
    log_telemetry: true
  "3":
    name: "critical"
    required_assurance: "A3"
    default_capabilities:
      - systems_research
      - architect_blueprint
      - security_builder
      - independent_reviewer
    require_spec: true
    require_state_file: true
    require_verify: true
    require_receipt_gate: true
    require_cross_model_audit: true
    require_review_map: true
    log_telemetry: true
